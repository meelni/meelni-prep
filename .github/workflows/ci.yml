name: CI

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        ready_for_review,
        converted_to_draft,
        synchronize,
        closed,
      ]
  push:
    branches: [main]
    paths-ignore:
      - ".github/stacked-prs.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false)
    name: >-
      ${{ (github.event_name == 'pull_request' &&
      (github.event.action == 'closed' || github.event.pull_request.draft)) &&
      'PR lifecycle / No hosted validation' || 'Validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: meelni_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meelni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/meelni_test
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Node.js dependencies
        run: npm ci --no-audit --no-fund

      - name: Install CI quality tooling
        run: python -m pip install --disable-pip-version-check uv==0.7.6

      - name: Validate repository skills
        run: npm run validate:skills

      - name: Run local tooling tests
        run: npm run test:local

      - name: Verify clean and legacy database migrations
        run: npm run test:database-migrations

      - name: Run type, lint, quality, and regression checks
        run: npm run check:ci

      - name: Run Python agent contract tests
        if: ${{ hashFiles('agent/test_runtime_contracts.py') != '' }}
        run: npm run test:python-agent

      - name: Build production application
        run: npm run build:browser:qa

      - name: Crawl production public routes and links
        run: npm run verify:public-production

      - id: playwright-version
        name: Resolve pinned Playwright version
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        name: Restore pinned Chromium
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium runtime
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        run: npm run test:browser:install

      - id: browser_qa
        name: Run representative browser QA
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        run: npm run test:browser:qa

      - name: Upload browser QA evidence
        if: ${{ always() && steps.browser_qa.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-qa-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/browser-qa/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
