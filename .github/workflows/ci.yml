name: CI

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        ready_for_review,
        converted_to_draft,
        synchronize,
        closed,
      ]
    paths-ignore:
      - ".github/stacked-prs.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false)
    name: Classify CI Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.changes.outputs.repository }}
      static: ${{ steps.changes.outputs.static }}
      tests: ${{ steps.changes.outputs.tests }}
      database: ${{ steps.changes.outputs.database }}
      production: ${{ steps.changes.outputs.production }}
      mode: ${{ steps.changes.outputs.mode }}
      reason: ${{ steps.changes.outputs.reason }}
    steps:
      - name: Check out repository merge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        name: Select required validation lanes
        run: node scripts/classify-ci-changes.mjs --github-output "$GITHUB_OUTPUT"

  repository:
    needs: classify
    if: >-
      (github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false)) &&
      needs.classify.outputs.repository == 'true'
    name: Repository and Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: true
    steps:
      - name: Check out repository merge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate changed documentation
        run: node scripts/classify-ci-changes.mjs --validate-docs

      - name: Verify public repository hygiene
        run: npm run verify:public-repository

      - name: Validate repository skills
        run: npm run validate:skills

  static:
    needs: classify
    if: >-
      (github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false)) &&
      needs.classify.outputs.static == 'true'
    name: Static and Python Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Node.js dependencies
        run: npm ci --no-audit --no-fund

      - name: Install CI quality tooling
        run: python -m pip install --disable-pip-version-check uv==0.7.6

      - name: Install pinned Python agent dependencies
        run: uv pip install --no-config --no-cache --system --requirements agent/requirements.txt

      - name: Validate repository skills
        run: npm run validate:skills

      - name: Run type, lint, and quality checks
        run: npm run check

      - name: Run Python agent contract tests
        if: ${{ hashFiles('agent/test_runtime_contracts.py') != '' }}
        run: npm run test:python-agent

  tests:
    needs: classify
    if: >-
      (github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false)) &&
      needs.classify.outputs.tests == 'true'
    name: Unit and Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Node.js dependencies
        run: npm ci --no-audit --no-fund

      - name: Run local tooling tests
        run: npm run test:local

      - name: Run end-interview resilience contract
        run: npm run test:interview-resilience

      - name: Run regression tests
        run: npm run test:ci

  database:
    needs: classify
    if: >-
      (github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false)) &&
      needs.classify.outputs.database == 'true'
    name: Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: meelni_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meelni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/meelni_test
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify clean and legacy database migrations
        run: npm run test:database-migrations

  production:
    needs: classify
    if: >-
      (github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false)) &&
      needs.classify.outputs.production == 'true'
    name: Production and Browser QA
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production application
        run: npm run build:browser:qa

      - name: Crawl production public routes and links
        run: npm run verify:public-production

      - id: browser_qa
        name: Run representative browser QA
        run: npm run test:browser:qa

      - name: Upload browser QA evidence
        if: ${{ always() && steps.browser_qa.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-qa-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/browser-qa/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  validate:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.draft == false))
    needs: [classify, repository, static, tests, database, production]
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && 'Manual Validate' ||
      (github.event_name == 'pull_request' &&
      (github.event.action == 'closed' || github.event.pull_request.draft)) &&
      'PR lifecycle / No hosted validation' || 'Validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected validation lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::Change classification concluded: $CLASSIFY_RESULT"
            exit 1
          fi

          if [ "$REPOSITORY_RESULT" = "success" ]; then
            for result in \
              "$STATIC_RESULT" \
              "$TESTS_RESULT" \
              "$DATABASE_RESULT" \
              "$PRODUCTION_RESULT"
            do
              if [ "$result" != "skipped" ]; then
                echo "::error::Documentation routing produced an unexpected lane result: $result"
                exit 1
              fi
            done
            exit 0
          fi

          if [ "$REPOSITORY_RESULT" != "skipped" ]; then
            echo "::error::Repository lane concluded: $REPOSITORY_RESULT"
            exit 1
          fi
          if [ "$STATIC_RESULT" != "success" ] || [ "$TESTS_RESULT" != "success" ]; then
            echo "::error::Code routing requires successful static and test lanes"
            exit 1
          fi
          for result in "$DATABASE_RESULT" "$PRODUCTION_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A heavy validation lane concluded: $result"
              exit 1
            fi
          done
