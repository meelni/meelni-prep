name: Relaunch Integration Gates

on:
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        closed,
        converted_to_draft,
        ready_for_review,
      ]
  push:
    branches: [main]
    paths:
      - ".github/stacked-prs.json"
      - ".github/workflows/stack-topology.yml"
      - "scripts/check-stacked-pr.mjs"
      - "scripts/check-stacked-pr-ci.mjs"
      - "scripts/revalidate-stacked-prs-ci.mjs"
      - "scripts/registry-only-validate-ci.mjs"
      - "scripts/check-migration-collisions.mjs"
      - "scripts/check-migration-collisions-ci.mjs"
      - "scripts/check-migration-collisions-event-ci.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A parent event must not overtake a child publication. Every event and
  # explicit/default-branch fan-out shares one non-cancelling publisher queue.
  group: stack-topology-publisher
  cancel-in-progress: false
  queue: max

jobs:
  verify-stack:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'closed' ||
      (github.event.pull_request.draft == false &&
      (github.event.action != 'edited' ||
      github.event.changes.body != null || github.event.changes.base != null)))
    # Classic protection requires this stable GitHub Actions job context.
    name: Trusted Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          # Required for exact refs/pull and parent fetches in this private repo.
          # The token can read contents and publish checks; PR code is never
          # checked out or executed.
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Verify exact stacked PR topology and dependents
        run: node scripts/revalidate-stacked-prs-ci.mjs --event-path "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Refresh trusted registry-only Validate snapshots
        run: node scripts/registry-only-validate-ci.mjs --sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  verify-migrations:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'closed' ||
      (github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null)))
    # Classic protection requires this stable GitHub Actions job context.
    name: Migration Collision Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migration-collision-audit
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Verify open-PR migration ownership
        run: node scripts/check-migration-collisions-event-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  audit-draft-impact:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == true &&
      (github.event.action == 'opened' || github.event.action == 'reopened' ||
      github.event.action == 'synchronize' ||
      (github.event.action == 'edited' && github.event.changes.base != null))
    name: Draft Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migration-collision-audit
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - id: stack_audit
        name: Refresh affected stack evidence
        continue-on-error: true
        run: node scripts/revalidate-stacked-prs-ci.mjs --event-path "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - id: migration_audit
        name: Refresh migration ownership
        if: always()
        continue-on-error: true
        run: node scripts/check-migration-collisions-event-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - id: registry_validate_sweep
        name: Refresh registry-only Validate snapshots
        if: always()
        continue-on-error: true
        run: node scripts/registry-only-validate-ci.mjs --sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Fail incomplete draft dependency audit
        if: >-
          always() &&
          (steps.stack_audit.outcome != 'success' ||
          steps.migration_audit.outcome != 'success' ||
          steps.registry_validate_sweep.outcome != 'success')
        run: exit 1

  refresh-registry-body-edits:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == true &&
      github.event.action == 'edited' &&
      github.event.changes.body != null &&
      github.event.changes.base == null
    name: Registry Validate Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Refresh registry-only Validate snapshots
        run: node scripts/registry-only-validate-ci.mjs --sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  revalidate-all:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Revalidate Open Pull Requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migration-collision-audit
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - id: stack_audit
        name: Revalidate every open registered stack
        continue-on-error: true
        run: node scripts/revalidate-stacked-prs-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - id: migration_audit
        name: Revalidate open migration owners
        if: always()
        continue-on-error: true
        run: node scripts/check-migration-collisions-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - id: registry_validate_sweep
        name: Revalidate registry-only Validate snapshots
        if: always()
        continue-on-error: true
        run: node scripts/registry-only-validate-ci.mjs --sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Fail incomplete full revalidation
        if: >-
          always() &&
          (steps.stack_audit.outcome != 'success' ||
          steps.migration_audit.outcome != 'success' ||
          steps.registry_validate_sweep.outcome != 'success')
        run: exit 1
