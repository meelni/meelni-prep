project: Meelni
purpose: PM interview practice with real questions, live voice reps, PM-calibrated feedback, and progress tracking.
principles:
  - Prefer PM interview behavior over generic interview-platform abstractions.
  - Keep LiveKit, Supabase, Stripe, PostHog, and Google Sheets behind clear boundaries.
  - Use specs for durable behavior changes that affect user promises, provider contracts, or data models.
