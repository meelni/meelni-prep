# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "meelni-prep"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH"

export NEXT_TELEMETRY_DISABLED=1
export NPM_CONFIG_CACHE="${CODEX_HOME:-$HOME/.codex}/cache/meelni/npm"
mkdir -p "$NPM_CONFIG_CACHE"

if [ -d /opt/homebrew/opt/python@3.12/libexec/bin ]; then
  export PATH="/opt/homebrew/opt/python@3.12/libexec/bin:$PATH"
fi

if [ -d /opt/homebrew/opt/expat/lib ]; then
  export DYLD_LIBRARY_PATH="/opt/homebrew/opt/expat/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
fi

if command -v fnm >/dev/null 2>&1; then
  eval "$(fnm env --shell bash)"
  fnm install "$(tr -d '[:space:]' < .node-version)"
  fnm use "$(tr -d '[:space:]' < .node-version)"
fi

npm run setup:local
npm run doctor
'''

[cleanup]
script = '''
cd "$CODEX_WORKTREE_PATH"

if command -v lsof >/dev/null 2>&1; then
  lsof -tiTCP:${CONDUCTOR_PORT:-3000} -sTCP:LISTEN | xargs kill 2>/dev/null || true
fi

rm -rf .next .turbo .context/tmp
'''

[[actions]]
name = "Dev"
icon = "run"
command = "npm run dev:local"

[[actions]]
name = "Pull Env"
icon = "tool"
command = "npx vercel@55.0.0 link --yes --project meelni && npm run env:pull && npm run doctor"

[[actions]]
name = "Check"
icon = "test"
command = "npm run typecheck && npm run lint"

[[actions]]
name = "Verify"
icon = "test"
command = "npm run verify:agent"

[[actions]]
name = "Env Check"
icon = "debug"
command = "npm run doctor && npm run validate:env"

[[actions]]
name = "DB Studio"
icon = "tool"
command = "npm run db:studio"

[[actions]]
name = "Target Tests"
icon = "test"
command = "npm run test:core && npm run test:agent && npm run test:integrations && npm run test:billing"
